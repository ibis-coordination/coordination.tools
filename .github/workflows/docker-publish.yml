name: Build and Publish Docker Image

# Builds a linux/amd64 production image and pushes it to
# ghcr.io/ibis-coordination/coordination-tools. Runs on version tags (v*)
# so releases are explicit; the workflow_dispatch trigger lets you push a
# manually-named tag from the Actions UI if you need to.
#
# Deploys pull these images with `kamal ship --version=X.Y.Z` (no local
# build) — see DEPLOY.md.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for the Docker image (e.g., v0.1.0 or latest)'
        required: true
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ibis-coordination/coordination-tools

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push linux/amd64 image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # `service=…` is what Kamal keys on to find its own containers;
          # `kamal deploy` adds it automatically for local builds, but
          # CI-built images have to set it explicitly or `kamal ship`
          # refuses to deploy the pulled image.
          labels: |
            ${{ steps.meta.outputs.labels }}
            service=coordination-tools
          platforms: linux/amd64
          # GitHub Actions cache — first build is slow, subsequent builds
          # skip unchanged layers (usually just app code changes)
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
